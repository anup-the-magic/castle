set -g visual-bell off
set -g bell-action any

set-option -sg escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g aggressive-resize on
set -g focus-events on

set -g mouse on
set-option -ga terminal-overrides ",xterm-256color:Tc,rxvt-unicode-256color:Tc,xterm-kitty:Tc"
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set-option -g prefix C-n
bind-key C-n send-prefix

# Use vim keybindings in copy mode
setw -g mode-keys vi
# main-window layout more reasonable
# 365 columns in 2k monitor
setw -g other-pane-width 90
set -g clock-mode-style 12

# NOTE: I'm not really sure how this is working
bind-key -N "Yank" -T copy-mode-vi              'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -N "Enter visual mode" -T copy-mode-vi 'v' send -X begin-selection

# Update default binding of `Enter` to also use copy-pipe
bind-key g copy-mode
unbind   -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# NOTE: See the section "PARSING SYNTAX" in `tmux(1)`, which covers "braces" syntax for strings
# include bindings without descriptions
bind-key -N "List all keys" ? list-keys -Na
#
# This exists to reset formatting?? idk what's going on here
bind-key -N "Show clock"    T  clock-mode
bind-key -N "Toggle mouse"  \\ set mouse

bind-key -N "Kill pane"     x   kill-pane
bind-key -N "Clear history" C-p clear-history

bind-key -N "Select pane via tree"  t   { choose-tree -sZ }
bind-key -N "Select pane via tree"  C-t { choose-tree -sZ }
bind-key -N "Swap pane via tree"    C-s { choose-tree "swap-pane -t %%" }
bind-key -N "Swap windows via tree" C-w { choose-tree -wZ "swap-window -t %%" }
bind-key -N "Move window to #9"     \$  { move-window -t 9 }

bind-key -N "Use main-vertical layout"             C-n     select-layout main-vertical
bind-key -N "Use main-vertical-mirrored layout"    C-b     select-layout main-vertical-mirrored
bind-key -N "Use even-horizontal (columns) layout" C-Space select-layout even-horizontal

bind-key -N "Split vertically and preserve CWD"   v split-window -h -c "#{pane_current_path}"
bind-key -N "Split horizontally and preserve CWD" s split-window -c    "#{pane_current_path}"

bind-key -N "Reload config" r run-shell "tmux source ~/.tmux.conf ; tmux display-message ' Reloaded config!'"

# NOTE: We add "Enter" here because of p10k's prompt, which otherwise produces a weird empty line
#       If that's not desired, just change this to `send-keys -R`
bind-key -N "Clear window without scrollback" C-a send-keys -R Enter

# NOTE: Pane Movement
bind-key -N "Move left"  h select-pane -L
bind-key -N "Move down"  j select-pane -D
bind-key -N "Move up"    k select-pane -U
bind-key -N "Move right" l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?((view|n?vim?x?)(diff)?|pipenv)$'"
# Matches gviewdiff, nvim, vidiff, ... -> against pane_current_command
is_vim="#{m/ri:g?(view|n?vim?x?)(diff)?,#{pane_current_command}}"
bind-key -N "Move left (vim-aware)"  -n C-h if-shell -F "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -N "Move down (vim-aware)"  -n C-j if-shell -F "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -N "Move up (vim-aware)"    -n C-k if-shell -F "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -N "Move right (vim-aware)" -n C-l if-shell -F "$is_vim" "send-keys C-l"  "select-pane -R"

bind -N "Split vertically and preserve CWD"   '"' split-window    -c "#{pane_current_path}"
bind -N "split horizontally and preserve CWD" %   split-window -h -c "#{pane_current_path}"
bind -N "Create new window and preserve CWD"  c   new-window      -c "#{pane_current_path}"

# Plugins
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum" # Requires tmux-resurrect
set -g @plugin "jimeh/tmux-themepack"

set -g @resurrect-save 'F5'
set -g @resurrect-restore 'F6'
bind-key -N "Swap panes via tree" C-s choose-tree "swap-pane -t %%"
bind-key -N "Renumber panes" C-r move-window -r

# Continuum options
# set -g @continuum-boot "on"
# set -g @continuum-boot-options "iterm,fullscreen"

set -g @themepack 'powerline/block/cyan'

run "~/.tmux/plugins/tpm/tpm"
